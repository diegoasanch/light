[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

# Dependency set matched to the embassy `cyw43-v0.7.0` release tag (examples/rp235x).
# These versions are a coherent, mutually-compatible group — bump them together,
# using the embassy repo's examples/rp235x/Cargo.toml at the matching cyw43 tag
# as the reference (NOT embassy main, which tracks unreleased APIs).

[dependencies]
# Embassy HAL + async runtime
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "binary-info",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"

# WiFi: CYW43439 (Murata 1YN module) over PIO gSPI + network stack
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "udp",
    "dns",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }
# default-features off: drops embedded-tls (unused here, and currently broken
# against der 0.8.x); we only do plain-HTTP requests from the firmware
reqwless = { version = "0.14.0", default-features = false, features = ["defmt"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.5.1"

# Runtime / debugging
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
static_cell = "2.1"

# Peripherals
smart-leds = "0.3.0"

[profile.release]
debug = true
